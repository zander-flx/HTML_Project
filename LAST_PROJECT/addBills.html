<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills - Expense Tracking System</title>
    <link rel="stylesheet" href="theStyle.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Expense Tracker</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <span class="text">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active" id="addExpenseToggle">
                        <span class="text">Add Expense</span>
                        <span class="arrow">▼</span>
                    </a>
                    <ul class="submenu" id="addExpenseSubmenu">
                        <li><a href="addFoods.html">Foods</a></li>
                        <li><a href="addBills.html" class="active">Bills</a></li>
                        <li><a href="addTransport.html">Transport</a></li>
                        <li><a href="addEntertainment.html">Entertainment</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="viewExpense.html" class="nav-link">
                        <span class="text">View Expense</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="header">
                <button class="toggle-btn" id="toggleSidebar">☰</button>
                <h1>Add Bill Expense</h1>
            </header>

            <div class="form-container">
                <form id="billExpenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div class="form-group">
                        <label for="billType">Bill Type *</label>
                        <select id="billType" name="billType">
                            <option value="">Select bill type</option>
                            <option value="electricity">Electricity</option>
                            <option value="water">Water</option>
                            <option value="internet">Internet</option>
                            <option value="phone">Phone/Mobile</option>
                            <option value="gas">Gas</option>
                            <option value="insurance">Insurance</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="provider">Provider/Company *</label>
                        <input type="text" id="provider" name="provider" placeholder="e.g., Meralco, Globe Telecom">
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($) *</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate" name="dueDate">
                    </div>

                    <div class="form-group">
                        <label for="accountNumber">Account Number</label>
                        <input type="text" id="accountNumber" name="accountNumber" placeholder="Account/Reference number">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Additional notes"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Expense</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="theScript.js"></script>
</body>
</html>
