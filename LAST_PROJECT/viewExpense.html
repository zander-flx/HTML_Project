<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Expenses - Expense Tracking System</title>
    <link rel="stylesheet" href="theStyle.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Expense Tracker</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <span class="text">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" id="addExpenseToggle">
                        <span class="text">Add Expense</span>
                        <span class="arrow">▼</span>
                    </a>
                    <ul class="submenu" id="addExpenseSubmenu">
                        <li><a href="addFoods.html">Foods</a></li>
                        <li><a href="addBills.html">Bills</a></li>
                        <li><a href="addTransport.html">Transport</a></li>
                        <li><a href="addEntertainment.html">Entertainment</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="viewExpense.html" class="nav-link active">
                        <span class="text">View Expense</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="header">
                <button class="toggle-btn" id="toggleSidebar">☰</button>
                <h1>View All Expenses</h1>
            </header>

            <div class="filter-section">
                <div class="filter-group">
                    <label for="filterCategory">Filter by Category:</label>
                    <select id="filterCategory">
                        <option value="all">All Categories</option>
                        <option value="foods">Foods</option>
                        <option value="bills">Bills</option>
                        <option value="transport">Transport</option>
                        <option value="entertainment">Entertainment</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDate">Date Range:</label>
                    <input type="month" id="filterDate">
                </div>
                <button class="btn btn-primary" onclick="filterExpenses()">Filter</button>
            </div>

            <div class="table-container">
                <table class="expense-table" id="allExpensesTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Payment Method</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTableBody">
                        <!-- Diri ma gwa ang Table Data -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="theScript.js"></script>
</body>
</html>
