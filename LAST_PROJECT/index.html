<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracking System - Dashboard</title>
    <link rel="stylesheet" href="theStyle.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Expense Tracker</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link active">
                        <span class="text">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" id="addExpenseToggle">
                        <span class="text">Add Expense</span>
                        <span class="arrow">▼</span>
                    </a>
                    <ul class="submenu" id="addExpenseSubmenu">
                        <li><a href="addFoods.html">Foods</a></li>
                        <li><a href="addBills.html">Bills</a></li>
                        <li><a href="addTransport.html">Transport</a></li>
                        <li><a href="addEntertainment.html">Entertainment</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="viewExpense.html" class="nav-link">
                        <span class="text">View Expense</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <button class="toggle-btn" id="toggleSidebar">☰</button>
                <h1>Dashboard</h1>
            </header>

            <div class="dashboard-content">
                <div class="stats-container">
                    <div class="stat-card">
                        <h3>Total Expenses</h3>
                        <p class="amount">$2,450.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>This Month</h3>
                        <p class="amount">$850.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>Categories</h3>
                        <p class="amount">4</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Transactions</h3>
                        <p class="amount">15</p>
                    </div>
                </div>

                 <div class="recent-expenses">
                    <h2>Recent Expenses</h2>
                    <table class="expense-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Descriptio n</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="recentExpensesTable">
                            <!-- Diri ma gwa ang Table Data -->
                        </tbody>
                    </table>
                </div> 
            </div>
        </main>
    </div>

    <script src="theScript.js"></script>
</body>
</html>
