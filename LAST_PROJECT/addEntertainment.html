<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entertainment - Expense Tracking System</title>
    <link rel="stylesheet" href="theStyle.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Expense Tracker</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <span class="text">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active" id="addExpenseToggle">
                        <span class="text">Add Expense</span>
                        <span class="arrow">▼</span>
                    </a>
                    <ul class="submenu" id="addExpenseSubmenu">
                        <li><a href="addFoods.html">Foods</a></li>
                        <li><a href="addBills.html">Bills</a></li>
                        <li><a href="addTransport.html">Transport</a></li>
                        <li><a href="addEntertainment.html" class="active">Entertainment</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="viewExpense.html" class="nav-link">
                        <span class="text">View Expense</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="header">
                <button class="toggle-btn" id="toggleSidebar">☰</button>
                <h1>Add Entertainment Expense</h1>
            </header>

            <div class="form-container">
                <form id="entertainmentExpenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div class="form-group">
                        <label for="entertainmentType">Entertainment Type *</label>
                        <select id="entertainmentType" name="entertainmentType">
                            <option value="">Select type</option>
                            <option value="movies">Movies/Cinema</option>
                            <option value="streaming">Streaming Subscription</option>
                            <option value="gaming">Gaming</option>
                            <option value="sports">Sports Events</option>
                            <option value="concerts">Concerts/Shows</option>
                            <option value="hobbies">Hobbies</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="venue">Venue/Platform *</label>
                        <input type="text" id="venue" name="venue" placeholder="e.g., SM Cinema, Netflix">
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($) *</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="duration">Duration/Period</label>
                        <input type="text" id="duration" name="duration" placeholder="e.g., 2 hours, Monthly">
                    </div>

                    <div class="form-group">
                        <label for="numberOfPeople">Number of People</label>
                        <input type="number" id="numberOfPeople" name="numberOfPeople" min="1" placeholder="1">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Additional notes"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Expense</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="theScript.js"></script>
</body>
</html>
