<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport - Expense Tracking System</title>
    <link rel="stylesheet" href="theStyle.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Expense Tracker</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <span class="text">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active" id="addExpenseToggle">
                        <span class="text">Add Expense</span>
                        <span class="arrow">▼</span>
                    </a>
                    <ul class="submenu" id="addExpenseSubmenu">
                        <li><a href="addFoods.html">Foods</a></li>
                        <li><a href="addBills.html">Bills</a></li>
                        <li><a href="addTransport.html" class="active">Transport</a></li>
                        <li><a href="addEntertainment.html">Entertainment</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a href="viewExpense.html" class="nav-link">
                        <span class="text">View Expense</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="header">
                <button class="toggle-btn" id="toggleSidebar">☰</button>
                <h1>Add Transport Expense</h1>
            </header>

            <div class="form-container">
                <form id="transportExpenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div class="form-group">
                        <label for="transportType">Transport Type *</label>
                        <select id="transportType" name="transportType">
                            <option value="">Select type</option>
                            <option value="fuel">Fuel/Gasoline</option>
                            <option value="public">Public Transport</option>
                            <option value="parking">Parking</option>
                            <option value="toll">Toll Fees</option>
                            <option value="maintenance">Vehicle Maintenance</option>
                            <option value="taxi">Taxi/Ride-sharing</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="location">From/To Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Home to Office">
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($) *</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="distance">Distance (km)</label>
                        <input type="number" id="distance" name="distance" step="0.1" min="0" placeholder="0.0">
                    </div>

                    <div class="form-group">
                        <label for="vehicle">Vehicle/Plate Number</label>
                        <input type="text" id="vehicle" name="vehicle" placeholder="Vehicle details">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Additional notes"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Expense</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="theScript.js"></script>
</body>
</html>
